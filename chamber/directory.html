<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the Chamber Directory for local businesses and services.">
    <meta name="keywords" content="Chamber Directory, local businesses, services, directory">
    <meta name="author" content="Muhire Bienvenue">
    <link rel="icon" href="images/favicon.ico">
    <title>Chamber Directory - Local Businesses and Services - kigali-Rwanda</title>

    <meta property="og:title" content="Chamber Directory">
    <meta property="og:description" content="Explore the Chamber Directory for local businesses and services.">
    <meta property="og:image" content="https://example.com/images/chamber-directory.jpg">
    <meta property="og:url" content="https://example.com/directory">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Chamber Directory">
    <meta property="twitter:description" content="Explore the Chamber Directory for local businesses and services.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/large.css">
    <link rel="stylesheet" href="styles/normalize.css">
    <script src="scripts/directory.js" defer></script>
</head>
<body>
    <header>
        <img src="images/logo.svg" alt="Chamber Logo" class="logo">
        <span>CHAMBER OF COMMERCE</span>
        <button
            id="nav-button"
            class="hamburger"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="primary-navigation">
        </button>
    </header>
    <nav>
        <h1>Directory</h1>

        <ul id="primary-navigation">
            <li><a href="home.html">Home</a></li>
            <li class="active">
                <a href="directory.html" aria-current="page">Directory</a>
            </li>
            <li><a href="join.html">Join</a></li>
            <li><a href="discover.html">Discover</a></li>
        </ul>
    </nav>
    <main>
        <button
            id="grid-view"
            aria-label="Switch to grid view"
            aria-pressed="true">
            Grid View
        </button>

        <button
            id="list-view"
            aria-label="Switch to list view"
            aria-pressed="false">
            List View
        </button>
        <section id="directory-container" class="grid-view">
            <h2>Directory</h2>
            <!-- Directory entries will be dynamically inserted here -->
        </section>
    </main>
    <footer>

    <!-- Contact Information -->
    <section class="contact-info">
        <h2>Contact Information</h2>

        <p>
            123 Main Street<br>
            Kigali, Rwanda<br>
            Email: info@chamber.org<br>
            Phone: +250 123 456 789
        </p>
    </section>


    <!-- Social Links -->
    <section class="social-links">
        <h2>Follow Us</h2>

        <ul>
            <li>
                <a
                    href="https://www.linkedin.com/company/chamber"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Follow us on LinkedIn"
                >
                    <img
                        src="images/linkedin.svg"
                        alt="LinkedIn"
                    >
                </a>
            </li>

            <li>
                <a
                    href="https://github.com/chamber"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Follow us on GitHub"
                >
                    <img
                        src="images/github.svg"
                        alt="GitHub"
                    >
                </a>
            </li>

            <li>
                <a
                    href="https://twitter.com/chamber"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Follow us on Twitter"
                >
                    <img
                        src="images/twitter.svg"
                        alt="Twitter"
                    >
                </a>
            </li>
        </ul>
    </section>


    <!-- Footer Information -->
    <section class="footer-bottom">

        <p>
            &copy; <span id="copyright-year"></span> 🌺 MUHIRE BIENVENUE 🌺 WDD 231
        </p>

        <span>
            Last Modified:
            <span id="last-modified"></span>
        </span>

    </section>

</footer>
</body>
</html>
